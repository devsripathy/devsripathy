name: Update Top Repositories

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Top Repositories & Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, urllib.request, json

          # GitHub Search API Query: High impact, utility, and modern tech projects
          # Filters for >10k stars created or active in modern tech domains
          query = "q=stars:>10000+topic:ai+topic:developer-tools&sort=stars&order=desc&per_page=10"
          url = f"https://api.github.com/search/repositories?{query}"

          req = urllib.request.Request(url)
          req.add_header("Authorization", f"token {os.environ[\"GITHUB_TOKEN\"]}")
          req.add_header("User-Agent", "Python-GitHub-Action")

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  items = data.get("items", [])
          except Exception as e:
              print(f"Error fetching GitHub API: {e}")
              items = []

          if items:
              table_content = "| # | Repository | Description | Primary Tech | Stars |\n"
              table_content += "| :--- | :--- | :--- | :--- | :--- |\n"
              
              for idx, repo in enumerate(items, 1):
                  name = repo["full_name"]
                  html_url = repo["html_url"]
                  desc = (repo["description"] or "No description provided.").replace("\n", " ").replace("|", "\\|")
                  lang = repo["language"] or "Multi"
                  stars = f"{repo[\"stargazers_count\"]:,}"

                  # Truncate long descriptions
                  if len(desc) > 80:
                      desc = desc[:77] + "..."

                  table_content += f"| {idx} | [{name}]({html_url}) | {desc} | `{lang}` | ⭐ {stars} |\n"

              # Read current README
              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()

              start_tag = "<!--START_SECTION:top-repos-->\n"
              end_tag = "<!--END_SECTION:top-repos-->"

              if start_tag in readme and end_tag in readme:
                  before = readme.split(start_tag)[0] + start_tag
                  after = end_tag + readme.split(end_tag)[1]
                  new_readme = before + "\n" + table_content + "\n" + after

                  with open("README.md", "w", encoding="utf-8") as f:
                      f.write(new_readme)
                  print("README.md successfully updated!")
              else:
                  print("Placeholder tags not found in README.md")
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update top 10 open-source repositories" || exit 0
          git push
