name: Update Top Repositories

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Top Repositories & Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, urllib.request, urllib.parse, json

          # Query top high-impact repositories with >25000 stars
          params = {
              "q": "stars:>25000",
              "sort": "stars",
              "order": "desc",
              "per_page": 10
          }
          url = "https://api.github.com/search/repositories?" + urllib.parse.urlencode(params)

          req = urllib.request.Request(url)
          req.add_header("Authorization", f"token {os.environ.get(\"GITHUB_TOKEN\")}")
          req.add_header("User-Agent", "Python-GitHub-Action")

          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
                  items = data.get("items", [])
          except Exception as e:
              print(f"Error fetching API: {e}")
              items = []

          if items:
              rows = []
              for idx, repo in enumerate(items, 1):
                  name = repo["full_name"]
                  html_url = repo["html_url"]
                  desc = (repo["description"] or "No description provided.").replace("\n", " ").replace("|", "\\|")
                  lang = repo["language"] or "Multi"
                  stars = f"{repo[\"stargazers_count\"]:,}"

                  if len(desc) > 75:
                      desc = desc[:72] + "..."

                  rows.append(f"| {idx} | [{name}]({html_url}) | {desc} | `{lang}` | ⭐ {stars} |")

              table_content = "\n".join(rows) + "\n"

              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()

              start_tag = "<!--START_SECTION:top-repos-->\n"
              end_tag = "<!--END_SECTION:top-repos-->"

              if start_tag in readme and end_tag in readme:
                  before = readme.split(start_tag)[0] + start_tag
                  after = end_tag + readme.split(end_tag)[1]
                  new_readme = before + table_content + after

                  with open("README.md", "w", encoding="utf-8") as f:
                      f.write(new_readme)
                  print("Successfully updated README.md!")
              else:
                  print("Error: Could not find START_SECTION or END_SECTION markers in README.md")
          '

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: update top 10 open-source repositories" || exit 0
          git push
