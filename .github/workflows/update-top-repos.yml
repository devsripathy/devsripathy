name: Update Top Repositories

on:
  schedule:
    - cron: '0 0 * * *'          # 00:00 UTC daily
  workflow_dispatch:
    inputs:
      repo_count:
        description: 'Number of repositories to fetch'
        required: false
        default: 10
        type: number

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch Top Repositories & Update README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_COUNT: ${{ inputs.repo_count || 10 }}
        run: |
          cat > /tmp/update_top_repos.py << 'PYEOF'
          import os
          import sys
          import urllib.request
          import urllib.parse
          import json
          from datetime import datetime
          import re

          token = os.environ.get("GITHUB_TOKEN", "")
          repo_count = int(os.environ.get("REPO_COUNT", 10))
          min_stars = 25000
          max_repos = min(repo_count, 100)

          print(f"📊 Fetching top {max_repos} repositories with >{min_stars:,} stars...")

          params = {
              "q": f"stars:>{min_stars}",
              "sort": "stars",
              "order": "desc",
              "per_page": max_repos,
          }
          url = "https://api.github.com/search/repositories?" + urllib.parse.urlencode(params)

          req = urllib.request.Request(url)
          if token:
              req.add_header("Authorization", f"token {token}")
          req.add_header("User-Agent", "Python-GitHub-Action")
          req.add_header("Accept", "application/vnd.github.v3+json")

          items = []
          total_count = 0
          for attempt in range(3):
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read().decode())
                      items = data.get("items", [])
                      total_count = data.get("total_count", 0)
                      if total_count > 0:
                          print(f"✅ Found {total_count:,} repositories with >{min_stars:,} stars")
                      break
              except urllib.error.HTTPError as e:
                  if e.code == 403 and attempt < 2:
                      print(f"⚠️ Rate limit, retrying… ({attempt+1}/3)")
                      import time
                      time.sleep(5)
                  else:
                      print(f"❌ HTTP {e.code}: {e.reason}")
                      sys.exit(1)
              except Exception as e:
                  print(f"❌ {e}")
                  if attempt == 2:
                      sys.exit(1)
                  import time
                  time.sleep(3)

          if not items:
              print("❌ Empty result from GitHub API")
              sys.exit(1)

          print(f"📝 Building markdown body with {len(items)} repositories...")

          rows = []
          for idx, repo in enumerate(items, 1):
              name = repo["full_name"]
              url = repo["html_url"]
              desc = (repo.get("description") or "No description provided.").replace("\n", " ").replace("|", "\\|")
              if len(desc) > 100:
                  desc = desc[:97] + "..."
              lang = f"`{repo.get('language') or 'Multi'}`"
              stars = f"⭐ {repo['stargazers_count']:,}"
              badge = " 🏆" if idx <= 3 else (" 💎" if repo["stargazers_count"] > 100_000 else "")
              rows.append(f"| {idx} | [{name}]({url}){badge} | {desc} | {lang} | {stars} |")

          table_body = "\n".join(rows) + "\n"
          timestamp = datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
          footer = f"\n*📅 Last updated: {timestamp}*\n"
          section_content = table_body + footer

          try:
              with open("README.md", "r", encoding="utf-8") as f:
                  readme = f.read()
          except FileNotFoundError:
              print("❌ README.md missing")
              sys.exit(1)

          start = "<!--START_SECTION:top-repos-->"
          end = "<!--END_SECTION:top-repos-->"
          if start not in readme or end not in readme:
              print("❌ Markers missing in README.md")
              sys.exit(1)

          pattern = re.compile(re.escape(start) + r".*?" + re.escape(end), re.DOTALL)
          new_section = f"{start}\n{section_content}{end}"
          new_readme = pattern.sub(new_section, readme)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(new_readme)

          if readme != new_readme:
              print("✅ README.md updated")
              print("\n📊 Top 5:")
              for i, repo in enumerate(items[:5], 1):
                  print(f"  {i}. {repo['full_name']} – ⭐ {repo['stargazers_count']:,}")
              if len(items) > 5:
                  print(f"  … and {len(items)-5} more")
          else:
              print("ℹ️ README already up-to-date")
          PYEOF

          python3 /tmp/update_top_repos.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "ℹ️ No changes to commit"
          else
            git add README.md
            git commit -m "docs: update top repositories [skip ci]"
            git push
            echo "✅ Pushed"
          fi

      - name: Done
        run: echo "✅ $(date -u)"
