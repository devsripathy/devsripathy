name: Update Guestbook

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  update-readme:
    if: contains(github.event.issue.title, 'Guestbook Entry')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Append visitor to README
        env:
          USER: ${{ github.event.issue.user.login }}
          BODY: ${{ github.event.issue.body }}
        run: |
          python3 -c '
          import os, datetime

          user = os.environ.get("USER", "")
          body = os.environ.get("BODY", "").replace("\n", " ").replace("|", "\\|").strip()
          date_str = datetime.datetime.utcnow().strftime("%Y-%m-%d")

          # Format as a proper Markdown table row
          entry = f"| {date_str} | [@{user}](https://github.com/{user}) | {body} |\n"

          with open("README.md", "r", encoding="utf-8") as f:
              content = f.read()

          target = "<!--START_SECTION:guestbook-->\n"
          if target in content:
              content = content.replace(target, target + entry)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: add @${{ github.event.issue.user.login }} to guestbook" || exit 0
          git push

      - name: Close the issue automatically
        uses: peter-evans/close-issue@v3
        with:
          issue-number: ${{ github.event.issue.number }}
          comment: "Thanks for signing my guestbook! Your entry is now live on my README. 🎉"
